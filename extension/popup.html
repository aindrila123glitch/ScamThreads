<!doctype html><html lang="en"><meta charset="utf-8"><title>ScamThreads Guard</title><link rel="stylesheet" href="guard.css">
<body class="popup"><header class="brand"><img src="icons/48.png" alt=""><div><div class="eyebrow">Browser threat protection</div><h1>ScamThreads Guard</h1></div></header>
<section id="card" class="card">
  <strong>Current tab analysis</strong>
  <div id="verdict-badge" style="font-weight:600; font-size:1.05rem; margin:0.35rem 0;">Checking tab status…</div>
  <p id="status" role="status" style="font-size:0.85rem; margin:0.25rem 0;"></p>
  <ul id="evidence-list" style="padding-left:1.1rem; margin:0.35rem 0; font-size:0.8rem; color:#d6e2f1;"></ul>
</section>
<div style="margin:0.5rem 0;">
  <button id="deep-investigate" style="width:100%; padding:0.45rem; background:#69ebbd; color:#0e1726; font-weight:600; border:none; border-radius:4px; cursor:pointer;">Open full investigation ↗</button>
</div>
<label class="option"><input type="checkbox" id="remote"> <span>Opt-in: verify TLS origin on local scanner</span></label>
<p style="margin:0.35rem 0;"><button id="refresh">Refresh local rules</button></p>
<a id="dashboard" href="http://127.0.0.1:8787/" target="_blank" rel="noopener">Open investigation dashboard ↗</a>
<script src="popup.js"></script></body></html>
