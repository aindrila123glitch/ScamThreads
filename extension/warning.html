<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Suspicious link intercepted · HackMatrix Threat Guard</title>
  <link rel="stylesheet" href="guard.css">
  <style>
    .warning main {
      width: min(100%, 620px);
      border: 1px solid #ff5c5c;
      border-top: 6px solid #ff5c5c;
      background: #0f1726;
      border-radius: 14px;
      padding: 36px 32px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.85);
    }
    .url-box {
      background: #162136;
      border: 1px solid #283956;
      border-radius: 8px;
      padding: 12px 16px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 13.5px;
      word-break: break-all;
      color: #ff8a7e;
      margin: 16px 0;
    }
    .btn-safe {
      background: #00dc82 !important;
      color: #080c14 !important;
      padding: 12px 24px !important;
      font-weight: 700 !important;
      font-size: 14px !important;
      border-radius: 6px !important;
      cursor: pointer;
    }
    .btn-unsafe {
      background: transparent !important;
      color: #ff8a7e !important;
      border: 1px solid #ff5c5c !important;
      padding: 12px 20px !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      border-radius: 6px !important;
      cursor: pointer;
    }
    .btn-safe:hover { filter: brightness(1.1); }
    .btn-unsafe:hover { background: rgba(255, 92, 92, 0.1) !important; }
  </style>
</head>
<body class="warning">
  <main>
    <header class="brand">
      <img src="icons/48.png" alt="HackMatrix Logo">
      <span class="eyebrow danger">HackMatrix Threat Guard · Intercepted</span>
    </header>

    <h1 style="color:#ffffff; margin: 12px 0 8px 0; font-size: 26px;">Suspicious link intercepted</h1>
    
    <div id="target-url" class="url-box">Checking destination address…</div>

    <p id="warning-reason" style="font-weight: 600; color: #ffae9e; font-size: 15px; margin: 0 0 12px 0;"></p>

    <p style="color: #cbd5e1; font-size: 14.5px; line-height: 1.5; margin: 0 0 24px 0;">
      This link was automatically intercepted before loading because it matched deceptive or fraudulent patterns. 
      <strong>Do you wish to continue or close?</strong>
    </p>

    <div class="actions" style="display:flex; flex-wrap:wrap; gap:12px; align-items:center;">
      <button id="btn-close" class="btn-safe">Close tab / Go back (Recommended)</button>
      <button id="btn-continue" class="btn-unsafe">Continue to site anyway (Unsafe)</button>
    </div>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid #1e293b;">
      <a id="btn-inspect" href="http://127.0.0.1:8787/" target="_blank" rel="noopener" style="color: #94a3b8; font-size: 13.5px; text-decoration: underline;">
        Investigate full evidence in HackMatrix Dashboard ↗
      </a>
    </div>
  </main>

  <script src="warning.js"></script>
</body>
</html>
